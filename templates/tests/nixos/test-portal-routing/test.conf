# Eval-only on the real hosts; per portal case a slim fake host whose portal data comes from
# cache.nixos.org NAR listings or compile-free stand-ins. Builds only trivial derivations plus
# xdg-desktop-portal and dbus (guarded by an empty-store dry run). Measured 871 s on 2026-11-12
# (with the ryoku case): the NAR scan of ~770 store paths against cache.nixos.org dominates, so
# the cap is 25 min; it was ~3 min local warm before that case.
group = heavy-a
timeout = 25
