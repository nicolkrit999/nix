# Builds system-path and home-path for every host/specialisation (mostly cached) and runs the
# real xdg-desktop-portal on a private bus; cold ~12 min.
# home-path omits bin-only script wrappers (03-homepath.nix) so noctalia is never source-built;
# system-path omits the heavy portal-less packages listed in 04-systempath.nix (openlogi).
group = heavy-c
timeout = 45
