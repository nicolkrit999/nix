# CI leg + caps for this test - see templates/tests/lib/discover.py for the keys.
# heavy-a: the longest test (QEMU-backed aarch64 dry builds of every module batch,
# ~107 s local / ~163 s CI warm); own leg so a cold run cannot starve cheap tests.
group = heavy-a
timeout = 30
# run-tests.sh --fast skips the specialisation batches.
fast_args = --fast
