name: "Build NixOS Configurations, push to cachix and flake checks"
env:
  CACHIX_NAME: krit-nixos
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 5"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Evaluation-only (this flake exposes no `checks` output), so it needs far
  # less time and disk than the build job and runs in parallel with it.
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      NIXPKGS_ALLOW_UNFREE: 1
      WEBHOOK_ID: ${{ secrets.DISCORD_WEBHOOK_ID }}
      CURL_HTTP_VERSION: 1.1
    steps:
      - uses: actions/checkout@v4

      - name: Install CA Certificates
        continue-on-error: true
        run: |
          # Best-effort freshness refresh: ca-certificates is preinstalled on
          # the runner image and Nix uses its own CA bundle (NIX_SSL_CERT_FILE),
          # so a broken third-party apt repo (packages.microsoft.com,
          # dl.google.com, ...) must never fail the job. Worst case we keep
          # the image's cert bundle - exactly what we'd have without this step.
          sudo rm -f $(grep -lr packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null) || true
          sudo apt-get update || true
          sudo apt-get install -y ca-certificates || true

      - name: Set up QEMU
        continue-on-error: true
        uses: docker/setup-qemu-action@v3

      - name: Add Swap
        continue-on-error: true
        run: |
          # GitHub-hosted runners ship with an active swap file, so fallocate
          # on /swapfile fails with "Text file busy" (ETXTBSY). Disable and
          # remove any existing swap first, then build a fresh swap file with
          # dd (the kernel-recommended method that avoids holes/ETXTBSY).
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          flakehub: false
          extra-conf: |
            build-dir = /nix/build
            extra-platforms = aarch64-linux
            # auto-optimise-store is deliberately OFF in CI. It hardlink-dedupes
            # every store file into /nix/store/.links, and that hardlink farm
            # does not round-trip cleanly through the cache-nix-action archive:
            # small, widely-shared files (stdenv's strip.sh, bash patch .drvs)
            # are exactly the ones that get deduped, and they come back missing
            # while db.sqlite still lists them as valid. Nix then trusts the db,
            # never re-substitutes, and the first step that actually *builds*
            # dies with "path ... does not exist". Disk is not the constraint
            # here (nothing-but-nix frees ~60 GB), so dedup buys us nothing.
            # Keep .drv files and build-time deps out of GC so a saved store
            # cache never has db entries pointing at pruned files (the
            # cache-nix-action-recommended guard against exactly the
            # "user-environment.drv does not exist" failure on restore).
            keep-outputs = true
            keep-derivations = true
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            download-attempts = 15
            http-connections = 25
            connect-timeout = 30

      # Restore only - the build job owns saving, so the two jobs never race
      # on cache writes. Non-critical: a broken/corrupted cache archive must
      # not fail this job, just slow it down to a cold build.
      - name: Restore Nix Store Cache
        id: cache_restore
        continue-on-error: true
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Only ever restore a store snapshot taken under the SAME flake.lock.
          # The old catch-all `nix-${{ runner.os }}-` fallback pulled in stores
          # from arbitrary older runs (and from timeout-killed jobs, which save
          # on purpose for retry-resume); cache-nix-action *merges* the restored
          # db.sqlite into the live one, so those stale rows became phantom
          # "valid" entries for paths the archive never carried.
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}

      - name: Verify Restored Store
        # Best-effort, and now declared as such. The `|| true` below already
        # made this practically unfailable, but the guarantee lived in the
        # command rather than the step: drop that `|| true` in a future edit
        # and a store-verify hiccup would silently skip the Cachix push AND
        # the store-cache save, because neither carries a status function that
        # survives a hard failure here.
        continue-on-error: true
        run: |
          # A restored cache can carry db registrations whose files never
          # made it into the archive (snapshot of a killed build - bit us on
          # 2026-07-07 as "user-environment.drv does not exist" in cachix's
          # nix-env install). --repair is load-bearing: plain `--verify` only
          # invalidates a missing path when NOTHING valid still refers to it.
          # A missing-but-referenced path (stdenv's strip.sh) is merely
          # reported as "disappeared, but it still has valid referrers!" and
          # left registered, so Nix keeps believing it exists and never
          # substitutes it - which is why the failure only surfaced later, at
          # the first step that actually builds something (the doom-emacs IFD).
          # --repair re-downloads those paths instead. No --check-contents: it
          # re-hashes the entire store and is far too slow here.
          # Best-effort: verify being unavailable must not fail the job.
          sudo -i nix-store --verify --repair || sudo /nix/var/nix/profiles/default/bin/nix-store --verify --repair || true

      # Non-critical: only used to speed up this job via the binary cache
      # substituter. A failed install must not fail the flake check.
      - name: Set up Cachix
        id: cachix_setup
        continue-on-error: true
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          nix profile install --accept-flake-config nixpkgs#cachix
          cachix use ${{ env.CACHIX_NAME }}

      # continue-on-error so the push below still runs. `nix flake check
      # --all-systems` realises real derivations (IFD, every host's closure
      # roots), and until now this job threw all of that away on both success
      # AND failure - it had no push step at all. Its outcome is re-asserted
      # by the status gate further down, so a genuine breakage still turns the
      # job red and fires the Discord notice - just after the cache is warm.
      - name: Check Flake
        id: flake_check
        continue-on-error: true
        run: nix flake check --all-systems --show-trace

      # This job builds real store paths and previously cached none of them.
      # Pushing them means build-x86_64 and the next run substitute instead of
      # rebuilding. Never fails the job: it is a cache optimisation.
      - name: Push Flake Check Output to Cachix
        id: cachix_push
        if: always() && steps.cachix_setup.outcome == 'success'
        continue-on-error: true
        env:
          CACHIX_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          # pipefail: the `| tee` below would otherwise mask cachix's exit code,
          # reintroducing exactly the silent-success failure this step exists
          # to avoid.
          set -o pipefail

          if [ -z "$CACHIX_TOKEN" ]; then
            echo "Skipping Cachix push: no auth token found (likely a fork)."
            echo "pushed=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No single output path to name here - flake check has many roots -
          # so push the store. Upstream-cache filtering keeps this to what this
          # run actually produced rather than a copy of nixpkgs.
          # -self-test-: the Determinate installer writes a self-test path per
          # run whose name carries a timestamp (self-test-bash-1787097653189,
          # self-test-zsh-...), so it is a brand-new store path every single
          # run. Observed being pushed on both platforms; left in, it grows the
          # cache without bound for no benefit, since nothing ever substitutes
          # it. Everything else the installer produces is version-stable and
          # deduplicates, so a narrow exclusion is enough.
          # Not a bare pipeline: GitHub runs these with `bash -e`, not
          # `-o pipefail`, so a failing `nix path-info` would be masked - cachix
          # would read empty stdin, report nothing to push and exit 0, and the
          # run would look fine while caching nothing. Materialise the list
          # first so that failure is visible.
          if ! nix path-info --all > allpaths.txt; then
            echo "::warning::nix path-info failed - nothing could be pushed this run."
            echo "pushed=error" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -v -e '\.drv$' -e '-self-test-' allpaths.txt > topush.txt || true
          if [ ! -s topush.txt ]; then
            echo "Nothing left to push after filtering."
            echo "pushed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cachix push ${{ env.CACHIX_NAME }} < topush.txt 2>&1 | tee push.log
          echo "pushed=$(grep -c '^Pushing ' push.log || true)" >> "$GITHUB_OUTPUT"

      - name: Check for Dead Code (deadnix)
        continue-on-error: true
        run: |
          NO_COLOR=1 nix run --inputs-from . nixpkgs#deadnix -- . > deadnix_report.txt || true
          if [ -s deadnix_report.txt ]; then
            echo "HAS_DEAD_CODE=true" >> $GITHUB_ENV
            echo "DEADCODE_REPORT<<EOF" >> $GITHUB_ENV
            head -n 20 deadnix_report.txt >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "HAS_DEAD_CODE=false" >> $GITHUB_ENV
          fi



      - name: Report Flake Check Status
        if: always()
        run: |
          if [ "${{ steps.flake_check.outcome }}" = "failure" ]; then
            echo "::error::nix flake check failed (its build output was still pushed to Cachix)"
            exit 1
          fi
          echo "flake check: ${{ steps.flake_check.outcome }}"

      # ONE consolidated notice per job, replacing the previous separate ones.
      # The old split was structurally unsound: hard failures fired on
      # failure() while infra problems fired on success(), so a FAILED job
      # suppressed the infra report entirely - you would never learn that
      # Cachix had broken too. It also let a condition name a step the message
      # body never mentioned, which is how a notice could fire listing nothing.
      # Collecting every finding in the same step that decides whether to send
      # removes both classes of bug.
      #
      # Silent on a clean run: no findings, no message.
      #
      # Shell note: findings are appended inside `if` blocks, never as
      # `[ test ] && append`. Under `bash -e` a false test makes that an `&&`
      # list returning non-zero, which aborts the step - the notifier would
      # stop at the first finding that did not apply.
      - name: Notify (flake-check)
        if: always() && env.WEBHOOK_ID != ''
        continue-on-error: true
        env:
          WEBHOOK_URL: https://discord.com/api/webhooks/${{ secrets.DISCORD_WEBHOOK_ID }}/${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CRIT=""; WARN=""; INFO=""; NOTE=""
          crit() { CRIT="${CRIT}🔴 $1"$'\n'; }
          warn() { WARN="${WARN}🟠 $1"$'\n'; }
          info() { INFO="${INFO}🔵 $1"$'\n'; }
          # note() rides along in a message that is being sent anyway, but never
          # causes one on its own. Routine facts - "0 new paths, everything was
          # already cached" - are true on every warm run, so promoting them to a
          # trigger would mean a Discord message after every single green build,
          # and a channel nobody reads is the same as no notifications at all.
          note() { NOTE="${NOTE}⚪ $1"$'\n'; }
          if [ "${{ steps.flake_check.outcome }}" = "failure" ]; then
            crit "\`nix flake check --all-systems\` failed - its build output was still pushed to Cachix"
          fi
          if [ "${{ steps.cachix_setup.outcome }}" = "failure" ]; then
            warn "Cachix CLI setup failed - nothing could be pushed this run"
          fi
          if [ "${{ steps.cachix_push.outcome }}" = "failure" ]; then
            warn "Cachix push failed - flake check output was not cached"
          fi
          if [ "${{ steps.cache_restore.outcome }}" = "failure" ]; then
            warn "Nix store cache restore failed - this run evaluated cold"
          fi
          P="${{ steps.cachix_push.outputs.pushed }}"
          if [ "$P" = "error" ]; then
            warn "\`nix path-info\` failed - the store could not be listed, so nothing was pushed"
          elif [ "$P" = "0" ]; then
            note "Cachix push uploaded 0 new paths"
          elif [ -n "$P" ] && [ "$P" != "skipped" ]; then
            note "Pushed $P new store path(s) to Cachix"
          fi
          if [ "${{ env.HAS_DEAD_CODE }}" = "true" ]; then
            info "Dead Nix code detected:"$'\n'"\`\`\`text"$'\n'"$DEADCODE_REPORT"$'\n'"\`\`\`"
          fi

          # Send decision uses CRIT/WARN/INFO only; NOTE rides along.
          BODY="${CRIT}${WARN}${INFO}${NOTE}"
          if [ -z "${CRIT}${WARN}${INFO}" ]; then
            echo "Nothing to report - no notification sent."
            exit 0
          fi
          if [ -n "$CRIT" ]; then
            HEAD="🚨 **flake-check - failed**"
          elif [ -n "$WARN" ]; then
            HEAD="⚠️ **flake-check - finished, but with problems**"
          else
            HEAD="ℹ️ **flake-check**"
          fi
          jq -n --arg h "$HEAD" --arg b "$BODY" --arg u "$RUN_URL" \
            '{content: ($h + "\n" + $b + "\n" + $u)}' > payload.json
          curl -s -H "Content-Type: application/json" -d @payload.json "$WEBHOOK_URL"



  # Builds the handful of large, independently-buildable packages in the
  # nixos-desktop closure (mostly Electron apps) in parallel, each with its
  # own timeout, and pushes them to Cachix before the main build starts. On
  # a cache-miss run (nixpkgs bump, cache outage, ...) this turns what used
  # to be serial rebuilding inside the single 270-minute build step into
  # several short parallel legs, so build-x86_64 mostly substitutes instead
  # of building. On a normal cache-hit run these legs no-op almost instantly
  # - the only cost is a bit of job-scheduling overhead. Never blocks the
  # main build: a failed/timed-out leg here just means that one package
  # rebuilds inside build-x86_64 as before.
  prewarm-cache:
    runs-on: ubuntu-latest
    # 120 rather than 60: a leg killed by the job timeout used to push nothing,
    # so a package that needed 70 minutes never got cached and every later run
    # paid for it again. It now pushes continuously (see below), but the extra
    # headroom lets the slow legs actually finish.
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        attr:
          - vscode
          - obs-studio
          - libreoffice-qt
          - teams-for-linux
          - vesktop
          - signal-desktop
          - tor-browser
    env:
      NIXPKGS_ALLOW_UNFREE: 1
      # Needed by the notifier below. Without it env.WEBHOOK_ID is empty and
      # the notice never fires - which is why this job stayed silent while its
      # push step failed on every leg of every run.
      WEBHOOK_ID: ${{ secrets.DISCORD_WEBHOOK_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          flakehub: false
          extra-conf: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            download-attempts = 15
            http-connections = 25
            connect-timeout = 30

      - name: Set up Cachix
        id: cachix_setup
        continue-on-error: true
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          nix profile install --accept-flake-config nixpkgs#cachix
          cachix use ${{ env.CACHIX_NAME }}

      # Built via the flake's own nixosConfigurations.nixos-desktop.pkgs
      # rather than plain nixpkgs#<attr>, so this is the exact same
      # derivation (overlays, unfree allowance, system) build-x86_64 would
      # otherwise build - not a look-alike from a different pkgs instantiation.
      # Under `cachix watch-exec`: a Nix post-build hook uploads each path the
      # moment it is built, so a leg that fails or is killed by the timeout
      # still leaves everything it completed in the cache. Successive runs then
      # start further along the dependency chain instead of from the same
      # place. The end-of-step push below stays as a backstop.
      - name: Pre-warm ${{ matrix.attr }}
        id: prewarm
        # 100 not 110: leaves a ~20-minute tail inside the 120-minute job
        # cap for the backstop push.
        continue-on-error: true
        timeout-minutes: 100
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          # Probe first: `cachix watch-exec` failing would be indistinguishable
          # from the build failing, and a cachix problem must never be reported
          # as a broken config. If the subcommand isn't usable, build plainly -
          # the end-of-job push still populates the cache either way.
          WATCH=0
          if [ "${{ steps.cachix_setup.outcome }}" = "success" ] && [ -n "$CACHIX_AUTH_TOKEN" ] \
             && cachix watch-exec --help > /dev/null 2>&1; then
            WATCH=1
          fi
          BUILD='nix build .#nixosConfigurations.nixos-desktop.pkgs.${{ matrix.attr }} --no-link --print-out-paths --keep-going > out.txt'
          if [ "$WATCH" = 1 ]; then
            echo "Building under 'cachix watch-exec' - paths are pushed as they are built."
            cachix watch-exec ${{ env.CACHIX_NAME }} -- bash -c "$BUILD"
          else
            bash -c "$BUILD"
          fi

      - name: Push ${{ matrix.attr }} to Cachix
        id: prewarm_push
        if: always() && steps.cachix_setup.outcome == 'success'
        continue-on-error: true
        env:
          # CACHIX_AUTH_TOKEN is the one cachix actually reads. Without it this
          # step failed with "Neither auth token nor signing key are present."
          # on every leg of every run, and continue-on-error hid it - the job
          # still reported success while pushing nothing. CACHIX_TOKEN is only
          # this script's own "is a token configured" guard.
          CACHIX_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          # pipefail: the `| tee` below would otherwise mask cachix's exit code,
          # reintroducing exactly the silent-success failure this step exists
          # to avoid.
          set -o pipefail

          if [ -z "$CACHIX_TOKEN" ]; then
            echo "Skipping Cachix push: no auth token found (likely a fork)."
            echo "pushed=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -s out.txt ]; then
            cachix push ${{ env.CACHIX_NAME }} $(cat out.txt) 2>&1 | tee push.log
            echo "pushed=$(grep -c '^Pushing ' push.log || true)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ${{ matrix.attr }} itself didn't finish, so there is no output
          # path - but its dependencies that DID build are the expensive part
          # and are exactly what this leg exists to warm. Push them rather
          # than discarding the whole leg. Upstream-cache filtering keeps this
          # to what actually got built here.
          echo "No output path for ${{ matrix.attr }} - pushing every valid store path instead."
          # -self-test-: the Determinate installer writes a self-test path per
          # run whose name carries a timestamp (self-test-bash-1787097653189,
          # self-test-zsh-...), so it is a brand-new store path every single
          # run. Observed being pushed on both platforms; left in, it grows the
          # cache without bound for no benefit, since nothing ever substitutes
          # it. Everything else the installer produces is version-stable and
          # deduplicates, so a narrow exclusion is enough.
          # Not a bare pipeline: GitHub runs these with `bash -e`, not
          # `-o pipefail`, so a failing `nix path-info` would be masked - cachix
          # would read empty stdin, report nothing to push and exit 0, and the
          # run would look fine while caching nothing. Materialise the list
          # first so that failure is visible.
          if ! nix path-info --all > allpaths.txt; then
            echo "::warning::nix path-info failed - nothing could be pushed this run."
            echo "pushed=error" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -v -e '\.drv$' -e '-self-test-' allpaths.txt > topush.txt || true
          if [ ! -s topush.txt ]; then
            echo "Nothing left to push after filtering."
            echo "pushed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cachix push ${{ env.CACHIX_NAME }} < topush.txt 2>&1 | tee push.log
          echo "pushed=$(grep -c '^Pushing ' push.log || true)" >> "$GITHUB_OUTPUT"

      # This job had NO notification at all, which is exactly why its push step
      # could fail with "Neither auth token nor signing key are present." on
      # every leg of every run without anyone noticing: the job is
      # continue-on-error at the job level, so its own red status is invisible
      # in the workflow result too. Reports per matrix leg, and only when
      # there is something wrong - a warm leg with nothing to push is silent.
      - name: Notify (pre-warm ${{ matrix.attr }})
        if: always() && env.WEBHOOK_ID != ''
        continue-on-error: true
        env:
          WEBHOOK_URL: https://discord.com/api/webhooks/${{ secrets.DISCORD_WEBHOOK_ID }}/${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          WARN=""
          warn() { WARN="${WARN}🟠 $1"$'\n'; }

          if [ "${{ steps.prewarm.outcome }}" = "failure" ]; then
            warn "\`${{ matrix.attr }}\` failed to build - the main build will have to build it"
          fi
          if [ "${{ steps.cachix_setup.outcome }}" = "failure" ]; then
            warn "Cachix CLI setup failed - this leg cached nothing"
          fi
          if [ "${{ steps.prewarm_push.outcome }}" = "failure" ]; then
            warn "Cachix push failed - \`${{ matrix.attr }}\` was built but not cached"
          fi
          if [ "${{ steps.prewarm_push.outputs.pushed }}" = "error" ]; then
            warn "\`nix path-info\` failed - nothing could be pushed"
          fi

          if [ -z "$WARN" ]; then
            echo "Nothing to report - no notification sent."
            exit 0
          fi
          jq -n --arg h "⚠️ **pre-warm ${{ matrix.attr }} - problem**" --arg b "$WARN" --arg u "$RUN_URL" \
            '{content: ($h + "\n" + $b + "\n" + $u)}' > payload.json
          curl -s -H "Content-Type: application/json" -d @payload.json "$WEBHOOK_URL"

  build-x86_64:
    needs: prewarm-cache
    # The pre-warm matrix is a pure speedup, never a correctness requirement
    # - a failed/skipped/timed-out leg there must never block the real build.
    if: always()
    runs-on: ubuntu-latest
    # Stay below GitHub's hard 360-minute job kill: a hard-killed job loses
    # its cache-save and cachix-flush steps, which is why retries used to
    # restart from zero.
    timeout-minutes: 350
    permissions:
      contents: read
      id-token: write
    env:
      NIXPKGS_ALLOW_UNFREE: 1
      WEBHOOK_ID: ${{ secrets.DISCORD_WEBHOOK_ID }}
      CURL_HTTP_VERSION: 1.1
    steps:
      - uses: actions/checkout@v4

      - name: Install CA Certificates
        continue-on-error: true
        run: |
          # Best-effort freshness refresh: ca-certificates is preinstalled on
          # the runner image and Nix uses its own CA bundle (NIX_SSL_CERT_FILE),
          # so a broken third-party apt repo (packages.microsoft.com,
          # dl.google.com, ...) must never fail the job. Worst case we keep
          # the image's cert bundle - exactly what we'd have without this step.
          sudo rm -f $(grep -lr packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null) || true
          sudo apt-get update || true
          sudo apt-get install -y ca-certificates || true

      - name: Set up QEMU
        continue-on-error: true
        uses: docker/setup-qemu-action@v3

      - name: Open permissions on /mnt
        continue-on-error: true
        run: sudo chmod 1777 /mnt

      - name: Add Swap
        continue-on-error: true
        run: |
          # GitHub-hosted runners ship with an active swap file, so fallocate
          # on /swapfile fails with "Text file busy" (ETXTBSY). Disable and
          # remove any existing swap first, then build a fresh swap file with
          # dd (the kernel-recommended method that avoids holes/ETXTBSY).
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Maximize Nix Space
        continue-on-error: true
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: "cleave"
          witness-carnage: true
          nix-permission-edict: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          flakehub: false
          extra-conf: |
            build-dir = /nix/build
            extra-platforms = aarch64-linux
            # auto-optimise-store is deliberately OFF in CI - see the same
            # comment in the flake-check job above. The hardlink farm it builds
            # under /nix/store/.links does not survive the cache-nix-action
            # archive round-trip, and this job is the one that *saves* the
            # cache that every other workflow restores.
            # Keep .drv files and build-time deps out of GC so a saved store
            # cache never has db entries pointing at pruned files (the
            # cache-nix-action-recommended guard against exactly the
            # "user-environment.drv does not exist" failure on restore).
            keep-outputs = true
            keep-derivations = true
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            download-attempts = 15
            http-connections = 25
            connect-timeout = 30

      # The run_id/run_attempt suffix makes every attempt save a fresh cache:
      # a key that is only the flake.lock hash can never be updated once it
      # exists, so a first failed attempt would freeze its partial store
      # forever. Restoration walks the prefixes newest-first instead.
      - name: Restore Nix Store Cache
        id: cache_restore
        continue-on-error: true
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Same-lock only - see the flake-check job for the rationale.
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}

      - name: Verify Restored Store
        # Best-effort, and now declared as such. The `|| true` below already
        # made this practically unfailable, but the guarantee lived in the
        # command rather than the step: drop that `|| true` in a future edit
        # and a store-verify hiccup would silently skip the Cachix push AND
        # the store-cache save, because neither carries a status function that
        # survives a hard failure here.
        continue-on-error: true
        run: |
          # A restored cache can carry db registrations whose files never
          # made it into the archive (snapshot of a killed build - bit us on
          # 2026-07-07 as "user-environment.drv does not exist" in cachix's
          # nix-env install). This job's timeout-killed builds still save
          # caches on purpose (retry-resume), so heal at restore time.
          # --repair is load-bearing: plain `--verify` leaves a missing path
          # registered whenever something valid still refers to it, so Nix
          # keeps trusting the db and never re-substitutes. See the longer
          # note in the flake-check job.
          # Best-effort: verify being unavailable must not fail the job.
          sudo -i nix-store --verify --repair || sudo /nix/var/nix/profiles/default/bin/nix-store --verify --repair || true

      # Non-critical: only used to speed up this job and to push the build
      # output below. A failed install must not fail the whole job - the
      # push step is separately gated on this step's outcome.
      - name: Set up Cachix
        id: cachix_setup
        continue-on-error: true
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          nix profile install --accept-flake-config nixpkgs#cachix
          cachix use ${{ env.CACHIX_NAME }}

      # Wrapped in `cachix watch-exec`, which registers a Nix post-build hook
      # and uploads each store path the moment it is built, in parallel with
      # the rest of the build. That is what keeps a run that never reaches the
      # push step from losing everything: hitting this step's timeout, the
      # 350-minute job cap, or a cancellation no longer discards hours of work,
      # because each path was already in the cache when it finished. It also
      # lets successive runs make incremental progress through a long chain.
      #
      # Nix does not fire the hook for substituted paths, so only what was
      # genuinely built here is uploaded. The push step below stays as a
      # backstop for anything the hook missed.
      #
      # --keep-going: when a derivation fails (broken dep, unfree, or a package
      # unsupported on this platform) keep building every other branch of the
      # graph, so one bad package doesn't cost us the whole closure.
      # Builds nixos-desktop AND nixos-laptop: a rebuild on either machine
      # after a flake bump should substitute rather than build, including
      # the host-specific paths that differ between them.
      - name: Build x86_64 Configurations
        id: build
        timeout-minutes: 270
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          # Redirect inside the inner shell so outpaths.txt gets Nix's stdout
          # only, never watch-exec's own progress output.
          # Probe first: `cachix watch-exec` failing would be indistinguishable
          # from the build failing, and a cachix problem must never be reported
          # as a broken config. If the subcommand isn't usable, build plainly -
          # the end-of-job push still populates the cache either way.
          WATCH=0
          if [ "${{ steps.cachix_setup.outcome }}" = "success" ] && [ -n "$CACHIX_AUTH_TOKEN" ] \
             && cachix watch-exec --help > /dev/null 2>&1; then
            WATCH=1
          fi
          # Both x86_64 hosts in ONE nix build on ONE runner, not two jobs:
          # they share nearly their whole closure, so the laptop's marginal
          # cost is only its host-specific derivations (home-manager
          # generation, system-path, activation scripts) rather than a second
          # full build. --keep-going means a failure in one still builds the
          # other, and --print-out-paths writes one line per realised toplevel,
          # so outpaths.txt may legitimately hold one path or two.
          # Backslash continuations, not bare newlines: BUILD is handed to
          # `bash -c`, which would otherwise read each line as its own command.
          BUILD='nix build \
                   .#nixosConfigurations.nixos-desktop.config.system.build.toplevel \
                   .#nixosConfigurations.nixos-laptop.config.system.build.toplevel \
                   --no-link --print-out-paths --keep-going --max-jobs 2 --cores 4 > outpaths.txt'
          if [ "$WATCH" = 1 ]; then
            echo "Building under 'cachix watch-exec' - paths are pushed as they are built."
            cachix watch-exec ${{ env.CACHIX_NAME }} -- bash -c "$BUILD"
          else
            echo "Cachix unavailable - building without continuous push."
            bash -c "$BUILD"
          fi

      # Pushing to the binary cache is a non-critical secondary goal: it must
      # never fail the job on its own (e.g. the 2026-07-08 "Error: not found:
      # cachix" incident).
      #
      # always(), not a success/failure gate: salvaging a broken run is the
      # whole point. Whatever DID build is still valid in the local store and
      # still worth caching - dropping it makes the next run rebuild it from
      # scratch.
      #
      # Cancellation is included deliberately. cancel-in-progress fires often
      # here (5 of 12 recent build.yml runs, 2 of 12 darwin runs), and run 1095
      # shows always() steps really do execute in the grace window before the
      # runner shuts down - it got roughly eleven minutes. That is the one
      # difference from Save Nix Store Cache below, which stays off cancelled
      # runs on purpose: a store snapshot taken mid-build is internally
      # inconsistent, whereas Cachix uploads whole valid paths one at a time,
      # so a push cut short just means fewer paths, never a corrupt cache.
      - name: Push to Cachix (x86_64)
        id: cachix_push
        if: always() && steps.cachix_setup.outcome == 'success'
        continue-on-error: true
        env:
          CACHIX_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          # pipefail: the `| tee` below would otherwise mask cachix's exit code,
          # reintroducing exactly the silent-success failure this step exists
          # to avoid.
          set -o pipefail

          if [ -z "$CACHIX_TOKEN" ]; then
            echo "Skipping Cachix push: no auth token found (likely a fork)."
            echo "pushed=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Gate on the build's OUTCOME, not merely on outpaths.txt being
          # non-empty. With two hosts, one can realise while the other fails -
          # outpaths.txt then holds a single path, the targeted branch would be
          # taken, and the failed host's completed dependencies would rely
          # entirely on watch-exec having been available. Requiring a clean
          # build before taking the fast path means any partial failure falls
          # through to the whole-store push instead.
          if [ "${{ steps.build.outcome }}" = "success" ] && [ -s outpaths.txt ]; then
            cachix push ${{ env.CACHIX_NAME }} $(cat outpaths.txt) 2>&1 | tee push.log
            echo "pushed=$(grep -c '^Pushing ' push.log || true)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # outpaths.txt is empty. --print-out-paths only prints paths Nix
          # actually realised, and the toplevel system depends on everything,
          # so ANY failed derivation leaves the toplevel unrealised and the
          # file empty - even when --keep-going built thousands of paths
          # first. Same when evaluation died before the build ran at all.
          # Skipping the push here is exactly what used to throw away every
          # partial result and make the next run start cold.
          #
          # Pushing the store wholesale is safe: Cachix's upstream-cache
          # filter (on by default) drops every path already present in
          # cache.nixos.org, so this uploads only what this repo actually
          # produced, not a copy of nixpkgs.
          echo "Build did not fully succeed - pushing every valid store path instead."
          # -self-test-: the Determinate installer writes a self-test path per
          # run whose name carries a timestamp (self-test-bash-1787097653189,
          # self-test-zsh-...), so it is a brand-new store path every single
          # run. Observed being pushed on both platforms; left in, it grows the
          # cache without bound for no benefit, since nothing ever substitutes
          # it. Everything else the installer produces is version-stable and
          # deduplicates, so a narrow exclusion is enough.
          # Not a bare pipeline: GitHub runs these with `bash -e`, not
          # `-o pipefail`, so a failing `nix path-info` would be masked - cachix
          # would read empty stdin, report nothing to push and exit 0, and the
          # run would look fine while caching nothing. Materialise the list
          # first so that failure is visible.
          if ! nix path-info --all > allpaths.txt; then
            echo "::warning::nix path-info failed - nothing could be pushed this run."
            echo "pushed=error" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -v -e '\.drv$' -e '-self-test-' allpaths.txt > topush.txt || true
          if [ ! -s topush.txt ]; then
            echo "Nothing left to push after filtering."
            echo "pushed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cachix push ${{ env.CACHIX_NAME }} < topush.txt 2>&1 | tee push.log
          echo "pushed=$(grep -c '^Pushing ' push.log || true)" >> "$GITHUB_OUTPUT"

      # Ordered directly after the Cachix push and before the diagnostic
      # steps: these two are the only things in the job that persist
      # anything, so nothing that merely prints information may run
      # ahead of them and eat a timeout or cancellation grace window.
      # Runs even when the build step failed or timed out, so partially built
      # derivations survive into the next attempt instead of rebuilding from
      # scratch every retry. NOT always(): a cancelled run (concurrency,
      # manual) snapshots a store whose db references paths the tar never
      # captures - restoring such a cache broke cachix's nix-env install
      # ("user-environment.drv does not exist", 2026-07-07). Skipping when
      # the build step never ran also stops early-failure runs from saving
      # a near-empty store that would shadow the good caches on restore
      # (restore picks the newest prefix match).
      - name: Save Nix Store Cache
        id: cache_save
        if: (success() || failure()) && steps.build.outcome != 'skipped'
        continue-on-error: true
        uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          gc-max-store-size-linux: 7000000000
          # Deliberately NO purge-* options. Purging needs an `actions: write`
          # permission this job doesn't grant, so they were always a silent
          # no-op - and actually granting it with purge-created: 0 would have
          # deleted every good cache on each save, leaving only this run's
          # (possibly broken) one. GitHub's 10 GB per-repo LRU eviction
          # handles cleanup on its own.

      # No `du -sh /nix/store` here: it walks the whole store and took over
      # ten minutes on a 32G store in run 1095, where it burned the entire
      # cancellation grace window and was SIGTERM'd (exit 143) before the
      # steps that actually persist anything could run. df reports the same
      # actionable number instantly.
      - name: Check Disk Usage
        if: always()
        continue-on-error: true
        run: |
          echo "--- Disk Space Usage ---"
          df -h /nix
          echo "--- Swap ---"
          free -h

      - name: Show Package Tree (x86_64)
        if: always()
        continue-on-error: true
        run: |
          if [ -s outpaths.txt ]; then
            nix path-info -sh -r $(cat outpaths.txt)
          else
            echo "No output paths were built."
          fi

      # ONE consolidated notice per job, replacing the previous separate ones.
      # The old split was structurally unsound: hard failures fired on
      # failure() while infra problems fired on success(), so a FAILED job
      # suppressed the infra report entirely - you would never learn that
      # Cachix had broken too. It also let a condition name a step the message
      # body never mentioned, which is how a notice could fire listing nothing.
      # Collecting every finding in the same step that decides whether to send
      # removes both classes of bug.
      #
      # Silent on a clean run: no findings, no message.
      #
      # Shell note: findings are appended inside `if` blocks, never as
      # `[ test ] && append`. Under `bash -e` a false test makes that an `&&`
      # list returning non-zero, which aborts the step - the notifier would
      # stop at the first finding that did not apply.
      - name: Notify (x86_64)
        if: always() && env.WEBHOOK_ID != ''
        continue-on-error: true
        env:
          WEBHOOK_URL: https://discord.com/api/webhooks/${{ secrets.DISCORD_WEBHOOK_ID }}/${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CRIT=""; WARN=""; INFO=""; NOTE=""
          crit() { CRIT="${CRIT}🔴 $1"$'\n'; }
          warn() { WARN="${WARN}🟠 $1"$'\n'; }
          info() { INFO="${INFO}🔵 $1"$'\n'; }
          # note() rides along in a message that is being sent anyway, but never
          # causes one on its own. Routine facts - "0 new paths, everything was
          # already cached" - are true on every warm run, so promoting them to a
          # trigger would mean a Discord message after every single green build,
          # and a channel nobody reads is the same as no notifications at all.
          note() { NOTE="${NOTE}⚪ $1"$'\n'; }
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            crit "Build failed or timed out - whatever DID build was still pushed to Cachix"
          fi
          if [ "${{ steps.cachix_setup.outcome }}" = "failure" ]; then
            warn "Cachix CLI setup failed - nothing could be pushed this run"
          fi
          if [ "${{ steps.cachix_push.outcome }}" = "failure" ]; then
            warn "Cachix push failed - build output was not cached"
          fi
          if [ "${{ steps.cache_restore.outcome }}" = "failure" ]; then
            warn "Nix store cache restore failed - this run built cold"
          fi
          if [ "${{ steps.cache_save.outcome }}" = "failure" ]; then
            warn "Nix store cache save failed - the next run starts cold"
          fi
          P="${{ steps.cachix_push.outputs.pushed }}"
          if [ "$P" = "error" ]; then
            warn "\`nix path-info\` failed - the store could not be listed, so nothing was pushed"
          elif [ "$P" = "0" ]; then
            note "Cachix push uploaded 0 new paths"
          elif [ -n "$P" ] && [ "$P" != "skipped" ]; then
            note "Pushed $P new store path(s) to Cachix"
          fi
          # 0 pushed after a FAILED build is different from 0 after a clean one:
          # --keep-going plus the whole-store fallback should have salvaged
          # something, so nothing uploaded means the salvage path itself did not
          # work. Worth waking someone for.
          if [ "$P" = "0" ] && [ "${{ steps.build.outcome }}" = "failure" ]; then
            warn "Build failed AND the fallback push uploaded nothing - partial results were NOT salvaged"
          fi

          # Send decision uses CRIT/WARN/INFO only; NOTE rides along.
          BODY="${CRIT}${WARN}${INFO}${NOTE}"
          if [ -z "${CRIT}${WARN}${INFO}" ]; then
            echo "Nothing to report - no notification sent."
            exit 0
          fi
          if [ -n "$CRIT" ]; then
            HEAD="🚨 **build-x86_64 - failed**"
          elif [ -n "$WARN" ]; then
            HEAD="⚠️ **build-x86_64 - finished, but with problems**"
          else
            HEAD="ℹ️ **build-x86_64**"
          fi
          jq -n --arg h "$HEAD" --arg b "$BODY" --arg u "$RUN_URL" \
            '{content: ($h + "\n" + $b + "\n" + $u)}' > payload.json
          curl -s -H "Content-Type: application/json" -d @payload.json "$WEBHOOK_URL"


